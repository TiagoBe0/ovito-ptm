# Windows build of the fork (MSVC 2022, Qt 6, Ninja) followed by the ctest suite, and a portable .zip package
# (artifact OVITO-windows-x64) that is checked to run on its own before it is uploaded.
#
# Build and test failures are also reported as a single error annotation on the job, so they can be
# read through the public check-runs API without downloading the logs.
name: Windows build

on:
  push:
    branches: [ feature/ptm-dxa, ovito-vacancy ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      # Not VCPKG_ROOT: the MSVC environment step overwrites that with the vcpkg bundled with Visual Studio.
      VCPKG_DIR: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'
          cache: true

      # vcpkg splits Boost into one port per library; these are the ones included anywhere under src/.
      # Static libraries with the dynamic MSVC runtime (like Qt): zstd's zlib wrapper, compiled into OVITO, cannot
      # redefine the functions that a shared zlib declares dllimport, and upstream OVITO links both statically.
      - name: Install Boost headers, zlib and zstd
        shell: bash
        run: |
          "$VCPKG_DIR/vcpkg" install --triplet x64-windows-static-md zlib zstd \
            boost-headers boost-algorithm boost-range boost-iterator boost-geometry boost-container boost-random \
            boost-spirit boost-phoenix boost-type-traits boost-ublas boost-math boost-lexical-cast boost-intrusive \
            boost-heap boost-dynamic-bitset boost-any
          ls "$VCPKG_DIR/installed/x64-windows-static-md/lib"
          echo "$VCPKG_DIR/installed/x64-windows-static-md/bin" >> "$GITHUB_PATH"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md \
            -DOVITO_BUILD_PLUGIN_NETCDFPLUGIN=OFF \
            -DOVITO_BUILD_PLUGIN_AIAGENT=OFF \
            -DOVITO_BUILD_PLUGIN_ML=OFF \
            -DOVITO_BUILD_PLUGIN_MLTRAINING=OFF \
            -DOVITO_BUILD_SSH_CLIENT=OFF \
            2>&1 | tee build.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 4 -- -k 0 2>&1 | tee -a build.log

      # The runner has no GPU, and Windows' own OpenGL 1.1 cannot create the viewport widgets (Qt then crashes in
      # QOpenGLWidget::resizeEvent). Qt loads desktop OpenGL only from system32, but with QT_OPENGL=software it
      # loads opengl32sw.dll from the application directory, which is what Mesa's llvmpipe opengl32.dll is meant for.
      - name: Install Mesa software OpenGL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern '*-release-msvc.7z' -D mesa
          7z x -omesa/x mesa/*.7z > /dev/null
          EXE_DIR=$(dirname "$(find build -name ovito.exe | head -n 1)")
          # Only the WGL driver: the archive also holds a d3d10warp.dll that would shadow the system's WARP device.
          cp mesa/x/x64/opengl32.dll "$EXE_DIR"/opengl32sw.dll
          for f in libgallium_wgl.dll libglapi.dll; do [ -f mesa/x/x64/$f ] && cp mesa/x/x64/$f "$EXE_DIR"/; done
          ls "$EXE_DIR"/*.dll | grep -iE 'opengl32|gallium|glapi|warp' || true

      - name: Test
        shell: bash
        env:
          # Ovito.exe is a GUI-subsystem program; without this its messages would not reach the log.
          QT_FORCE_STDERR_LOGGING: '1'
          GALLIUM_DRIVER: llvmpipe
          QT_OPENGL: software
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 600 2>&1 | tee ctest.log

      # cmake --install copies the Qt DLLs and Qt plugins (see cmake/Prerequisites.cmake). Added here: the vcpkg DLLs,
      # the MSVC runtime (so the Visual C++ redistributable need not be installed), Mesa as the software OpenGL
      # fallback, and the end-user notes.
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          PKG=pkg/OVITO-windows-x64
          cmake --install build --prefix "$PKG" 2>&1 | tee install.log
          EXE_DIR=$(dirname "$(find "$PKG" -name ovito.exe | head -n 1)")
          cp "$VCPKG_DIR"/installed/x64-windows-static-md/bin/*.dll "$EXE_DIR"/ 2>/dev/null || true
          CRT=$(ls -d "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC*.CRT | head -n 1)
          cp "$CRT"/*.dll "$EXE_DIR"/
          BUILD_EXE_DIR=$(dirname "$(find build -name ovito.exe | head -n 1)")
          for f in opengl32sw.dll libgallium_wgl.dll libglapi.dll; do [ -f "$BUILD_EXE_DIR/$f" ] && cp "$BUILD_EXE_DIR/$f" "$EXE_DIR"/; done
          cp research/windows_build/package/* "$EXE_DIR"/
          echo "commit ${GITHUB_SHA}" > "$EXE_DIR"/VERSION.txt
          find "$PKG" -name '*.pdb' -delete
          du -sh "$PKG"; ls "$EXE_DIR"

      # Git Bash names the first DLL it cannot find in PATH when a program fails to load, which is usually an
      # api-ms-win-* API set and not the DLL that is really missing. So list the imports of every binary in the package
      # that are neither next to ovito.exe nor in System32.
      - name: Check package DLL dependencies
        shell: bash
        run: |
          EXE_DIR=$(dirname "$(find pkg -name ovito.exe | head -n 1)")
          missing=0
          while IFS= read -r -d '' bin; do
            for dll in $(dumpbin -nologo -dependents "$bin" | tr -d '\r' | grep -iE '^ +[^ ]+\.dll$'); do
              case "${dll,,}" in api-ms-win-*|ext-ms-*) continue ;; esac
              if [ ! -f "$EXE_DIR/$dll" ] && [ ! -f "/c/Windows/System32/$dll" ]; then
                echo "MISSING: $dll  (needed by ${bin#pkg/})"
                missing=1
              fi
            done
          done < <(find pkg -iname '*.exe' -print0 -o -iname '*.dll' -print0)
          [ $missing -eq 0 ] && echo "All DLL dependencies are in the package or in System32."
          exit $missing

      # Run the package with a PATH that holds only Windows and the shell, so that any DLL it still loads from
      # Qt, vcpkg or Visual Studio on the runner would make it fail.
      - name: Test package in isolation
        shell: bash
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          EXE=$(find pkg -name ovito.exe | head -n 1)
          CLEAN_PATH="/usr/bin:/c/Windows/System32:/c/Windows"
          for t in bond-order-selftest structure-factor-selftest dxa-selftest; do
            PATH="$CLEAN_PATH" timeout 600 "$EXE" --nogui --$t > isolated.log 2>&1 || { echo "FAILED: --$t (exit $?)"; tail -n 30 isolated.log; exit 1; }
            echo "ok: --$t"
          done
          PATH="$CLEAN_PATH" QT_OPENGL=software GALLIUM_DRIVER=llvmpipe timeout 600 "$EXE" --gui-editors-selftest particles 2>&1 | tail -n 3
          test ${PIPESTATUS[0]} -eq 0
          cd pkg && 7z a -tzip -mx=7 OVITO-windows-x64.zip OVITO-windows-x64 > /dev/null && ls -la OVITO-windows-x64.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OVITO-windows-x64
          path: pkg/OVITO-windows-x64.zip
          compression-level: 0

      # On a crashing test, rerun the GUI smoke tests under the console debugger to get a stack trace.
      - name: Stack traces of crashing GUI tests
        if: failure()
        shell: bash
        env:
          QT_FORCE_STDERR_LOGGING: '1'
          GALLIUM_DRIVER: llvmpipe
          QT_OPENGL: software
        run: |
          CDB="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          EXE=$(find build -name ovito.exe | head -n 1)
          [ -x "$CDB" ] && [ -n "$EXE" ] || { echo "cdb or ovito.exe not found"; exit 0; }
          for mode in grid particles; do
            echo "===== --gui-editors-selftest $mode" | tee -a cdb.log
            timeout 600 "$CDB" -g -G -lines -c ".ecxr; kP 40; ~*k 15; q" "$EXE" --gui-editors-selftest $mode >> cdb.log 2>&1 || true
          done
          tail -n 200 cdb.log

      - name: Report errors as annotation
        if: failure()
        shell: bash
        run: |
          report() {
            # Annotation messages are single-line; encode newlines as %0A.
            local msg
            msg=$(grep -E "$2" "$1" | head -n 80 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$msg" ] && echo "::error title=$3::$msg"
          }
          [ -f build.log ] && report build.log ' error |error:|FAILED:|fatal error|CMake Error|LNK[0-9]+' "Build errors"
          [ -f ctest.log ] && report ctest.log 'FAIL|Failed|\*\*\*|Exception|tests passed' "Test failures"
          true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            ctest.log
            cdb.log
            install.log
          if-no-files-found: ignore
