# Linux build of the fork (GCC, system Qt 6 of Ubuntu 24.04, Ninja) followed by the ctest suite. Same branches
# as the Windows build, so every push is checked on both platforms.
#
# Build and test failures are also reported as a single error annotation on the job, so they can be
# read through the public check-runs API without downloading the logs.
name: Linux build

on:
  push:
    branches: [ feature/ptm-dxa, ovito-vacancy ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The same packages the local development machine (Ubuntu 24.04) builds against. Mesa provides the
      # software OpenGL that the GUI editor tests need under QT_QPA_PLATFORM=offscreen.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev libgl-dev libegl-dev libxkbcommon-dev libvulkan-dev \
            libboost-dev libnetcdf-dev zlib1g-dev libzstd-dev \
            libgl1-mesa-dri libegl-mesa0 libglx-mesa0 patchelf

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-

      - name: Configure
        run: |
          set -o pipefail
          ccache --max-size=2G
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOVITO_BUILD_SSH_CLIENT=OFF \
            2>&1 | tee build.log

      # 4 jobs: the runner has 16 GB and some translation units need more than 2 GB each.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 4 -- -k 0 2>&1 | tee -a build.log
          ccache --show-stats

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 600 2>&1 | tee ctest.log

      - name: Build AppImage
        run: |
          set -o pipefail
          bash research/linux_build/build_appimage.sh build appimage 2>&1 | tee appimage.log

      # A bare Ubuntu image has none of the Qt, Boost or zstd packages of the runner, so the AppImage only passes if
      # it bundles them. It gets just the libraries that linuxdeploy deliberately leaves to the host (OpenGL, X11,
      # fontconfig), which every desktop has.
      - name: Test AppImage in a bare container
        run: |
          docker run --rm -v "$PWD/appimage:/w" -e APPIMAGE_EXTRACT_AND_RUN=1 ubuntu:24.04 bash -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              libgl1 libegl1 libgl1-mesa-dri libopengl0 libfontconfig1 libx11-6 libx11-xcb1 libxkbcommon0 > /dev/null
            cd /tmp
            fail() {
              echo "FAILED: $1"; tail -n 30 run.log
              /w/OVITO-x86_64.AppImage --appimage-extract > /dev/null
              echo "Libraries missing from the AppImage:"
              find squashfs-root -type f \( -name "*.so*" -o -path "*/bin/ovito" \) -exec ldd {} \; 2>/dev/null | grep "not found" | sort -u
              exit 1
            }
            for t in bond-order-selftest structure-factor-selftest dxa-selftest; do
              timeout 600 /w/OVITO-x86_64.AppImage --nogui --$t > run.log 2>&1 || fail "--$t"
              echo "ok: --$t"
            done
            QT_QPA_PLATFORM=offscreen LIBGL_ALWAYS_SOFTWARE=1 timeout 600 /w/OVITO-x86_64.AppImage --gui-editors-selftest particles > run.log 2>&1 || fail "--gui-editors-selftest particles"
            tail -n 3 run.log'
          cp research/linux_build/package/LEEME.txt appimage/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OVITO-linux-x86_64
          path: |
            appimage/OVITO-x86_64.AppImage
            appimage/LEEME.txt
          compression-level: 0

      - name: Report errors as annotation
        if: failure()
        run: |
          report() {
            # Annotation messages are single-line; encode newlines as %0A.
            local msg
            msg=$(grep -E "$2" "$1" | head -n 80 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$msg" ] && echo "::error title=$3::$msg"
          }
          [ -f build.log ] && report build.log 'error:|FAILED:|fatal error|CMake Error|undefined reference' "Build errors"
          [ -f ctest.log ] && report ctest.log 'FAIL|Failed|\*\*\*|Exception|tests passed' "Test failures"
          true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux
          path: |
            build.log
            ctest.log
            appimage.log
          if-no-files-found: ignore
